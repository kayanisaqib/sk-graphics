<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VORTEX // Fluid Dynamics Engine</title>
    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent: #00ffcc;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-color);
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            font-size: 12px;
            text-shadow: 0 0 4px #000;
            line-height: 1.5;
            z-index: 10;
        }

        .hud-value {
            color: var(--accent);
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }

        button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.1);
        }

        button.active {
            color: var(--text-color);
        }

        button.active::before {
            content: '●';
            color: var(--accent);
            font-size: 10px;
        }

        button:not(.active)::before {
            content: '○';
            font-size: 10px;
        }

        #btn-clear::before, #btn-mute::before {
            display: none;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>VORTEX // FLUID DYNAMICS ENGINE</div>
        <div>MODE: <span id="hud-mode" class="hud-value">INK DROP</span></div>
        <div>VORTICITY: <span id="hud-vorticity" class="hud-value">0.00</span></div>
        <div>REYNOLDS (EST): <span id="hud-reynolds" class="hud-value">0</span></div>
        <div>AUDIO: <span id="hud-audio" class="hud-value">INACTIVE</span></div>
    </div>

    <canvas id="sim-canvas"></canvas>
    
    <div id="controls">
        <button id="btn-ink" class="active">Ink Drop</button>
        <button id="btn-smoke">Smoke</button>
        <button id="btn-vortex">Vortex Streets</button>
        <div style="width: 1px; background: rgba(255,255,255,0.2); margin: 0 5px;"></div>
        <button id="btn-clear">Clear</button>
        <button id="btn-mute">Mute: Off</button>
    </div>

    <script>
        // --- Fluid Dynamics Engine (Navier-Stokes on CPU) ---
        // Based on Jos Stam's "Real-Time Fluid Dynamics for Games"
        
        const iter = 4;
        let N = 100; // Grid resolution (N x N)
        const size = (N + 2) * (N + 2);
        
        let s = new Float32Array(size);
        let density = new Float32Array(size);
        
        let densityR = new Float32Array(size);
        let densityG = new Float32Array(size);
        let densityB = new Float32Array(size);
        let sR = new Float32Array(size);
        let sG = new Float32Array(size);
        let sB = new Float32Array(size);
        
        let Vx = new Float32Array(size);
        let Vy = new Float32Array(size);
        let Vx0 = new Float32Array(size);
        let Vy0 = new Float32Array(size);
        
        const dt = 0.1;
        const diff = 0.0000;
        const visc = 0.0000;
        
        // Mode state
        const MODES = {
            INK: 0,
            SMOKE: 1,
            VORTEX: 2
        };
        let currentMode = MODES.INK;
        let obstacles = new Uint8Array(size); // 1 if obstacle

        function IX(x, y) {
            return x + (N + 2) * y;
        }

        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
                x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
            }
            
            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
            x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
            x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);

            // Handle obstacles
            if (currentMode === MODES.VORTEX) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        if (obstacles[IX(i, j)]) {
                            if (b === 1) x[IX(i, j)] = 0; // x-velocity 0 inside obstacle
                            if (b === 2) x[IX(i, j)] = 0; // y-velocity 0 inside obstacle
                            if (b === 0) x[IX(i, j)] = 0; // density 0 inside obstacle
                        }
                    }
                }
            }
        }

        function lin_solve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;
            for (let k = 0; k < iter; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        if (currentMode === MODES.VORTEX && obstacles[IX(i, j)]) continue;
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i + 1, j)] + x[IX(i - 1, j)] + x[IX(i, j + 1)] + x[IX(i, j - 1)])) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff, dt) {
            let a = dt * diff * N * N;
            lin_solve(b, x, x0, a, 1 + 4 * a);
        }

        function advect(b, d, d0, u, v, dt) {
            let i0, j0, i1, j1;
            let x, y, s0, t0, s1, t1;
            let dt0 = dt * N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    if (currentMode === MODES.VORTEX && obstacles[IX(i, j)]) continue;

                    x = i - dt0 * u[IX(i, j)];
                    y = j - dt0 * v[IX(i, j)];
                    
                    if (x < 0.5) x = 0.5;
                    if (x > N + 0.5) x = N + 0.5;
                    i0 = Math.floor(x);
                    i1 = i0 + 1;
                    
                    if (y < 0.5) y = 0.5;
                    if (y > N + 0.5) y = N + 0.5;
                    j0 = Math.floor(y);
                    j1 = j0 + 1;
                    
                    s1 = x - i0;
                    s0 = 1.0 - s1;
                    t1 = y - j0;
                    t0 = 1.0 - t1;
                    
                    d[IX(i, j)] = 
                        s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                        s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function project(u, v, p, div) {
            let h = 1.0 / N;
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    if (currentMode === MODES.VORTEX && obstacles[IX(i, j)]) continue;
                    div[IX(i, j)] = -0.5 * h * (u[IX(i + 1, j)] - u[IX(i - 1, j)] + v[IX(i, j + 1)] - v[IX(i, j - 1)]);
                    p[IX(i, j)] = 0;
                }
            }
            set_bnd(0, div);
            set_bnd(0, p);
            
            lin_solve(0, p, div, 1, 4);
            
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    if (currentMode === MODES.VORTEX && obstacles[IX(i, j)]) continue;
                    u[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h;
                    v[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h;
                }
            }
            set_bnd(1, u);
            set_bnd(2, v);
        }

        function vel_step(u, v, u0, v0, dt) {
            let temp;
            // Add buoyancy if smoke mode
            if (currentMode === MODES.SMOKE) {
                for (let i = 1; i <= N; i++) {
                    for (let j = 1; j <= N; j++) {
                        let dens = density[IX(i, j)];
                        v0[IX(i, j)] -= dens * 0.05; // Upward force based on density
                    }
                }
            }
            
            // Continuous flow for vortex mode
            if (currentMode === MODES.VORTEX) {
                for (let j = 1; j <= N; j++) {
                    u0[IX(1, j)] += 2.0; // Inflow from left
                    density[IX(1, j)] = 200; // Inject smoke at left
                }
            }

            // Swap
            temp = u; u = u0; u0 = temp;
            temp = v; v = v0; v0 = temp;
            
            diffuse(1, u, u0, visc, dt);
            diffuse(2, v, v0, visc, dt);
            
            project(u, v, u0, v0);
            
            temp = u; u = u0; u0 = temp;
            temp = v; v = v0; v0 = temp;
            
            advect(1, u, u0, u0, v0, dt);
            advect(2, v, v0, u0, v0, dt);
            
            project(u, v, u0, v0);
        }

        function dens_step(x, x0, u, v, diff, dt) {
            let temp = x; x = x0; x0 = temp;
            diffuse(0, x, x0, diff, dt);
            temp = x; x = x0; x0 = temp;
            advect(0, x, x0, u, v, dt);
            
            // Dissipation
            let diss = currentMode === MODES.SMOKE ? 0.99 : 0.998;
            for (let i = 0; i < size; i++) {
                x[i] *= diss;
            }
        }

        function color_step(dt) {
            let temp;
            
            temp = densityR; densityR = sR; sR = temp;
            advect(0, densityR, sR, Vx, Vy, dt);
            
            temp = densityG; densityG = sG; sG = temp;
            advect(0, densityG, sG, Vx, Vy, dt);
            
            temp = densityB; densityB = sB; sB = temp;
            advect(0, densityB, sB, Vx, Vy, dt);
            
            let diss = 0.995;
            for (let i = 0; i < size; i++) {
                densityR[i] *= diss;
                densityG[i] *= diss;
                densityB[i] *= diss;
            }
        }

        function add_density(x, y, amount) {
            density[IX(x, y)] += amount;
        }

        function add_color(x, y, r, g, b, amount) {
            densityR[IX(x, y)] += r * amount;
            densityG[IX(x, y)] += g * amount;
            densityB[IX(x, y)] += b * amount;
        }

        function add_velocity(x, y, amountX, amountY) {
            Vx[IX(x, y)] += amountX;
            Vy[IX(x, y)] += amountY;
        }

        function setup_obstacles() {
            obstacles.fill(0);
            if (currentMode === MODES.VORTEX) {
                // Add a circular obstacle
                let cx = Math.floor(N * 0.25);
                let cy = Math.floor(N * 0.5);
                let r = 5;
                for (let j = cy - r; j <= cy + r; j++) {
                    for (let i = cx - r; i <= cx + r; i++) {
                        if ((i-cx)*(i-cx) + (j-cy)*(j-cy) <= r*r) {
                            obstacles[IX(i, j)] = 1;
                        }
                    }
                }
            }
        }

        // --- Rendering ---
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let cellWidth = width / N;
        let cellHeight = height / N;
        
        let imgData = ctx.createImageData(width, height);
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Adjust N based on screen size for performance vs quality
            N = Math.min(120, Math.floor(window.innerWidth / 8));
            cellWidth = width / N;
            cellHeight = height / N;
            
            let newSize = (N + 2) * (N + 2);
            s = new Float32Array(newSize);
            density = new Float32Array(newSize);
            densityR = new Float32Array(newSize);
            densityG = new Float32Array(newSize);
            densityB = new Float32Array(newSize);
            sR = new Float32Array(newSize);
            sG = new Float32Array(newSize);
            sB = new Float32Array(newSize);
            Vx = new Float32Array(newSize);
            Vy = new Float32Array(newSize);
            Vx0 = new Float32Array(newSize);
            Vy0 = new Float32Array(newSize);
            obstacles = new Uint8Array(newSize);
            
            setup_obstacles();
            imgData = ctx.createImageData(width, height);
        }

        window.addEventListener('resize', resize);
        resize();

        function HSVtoRGB(h, s, v) {
            let r, g, b, i, f, p, q, t;
            i = Math.floor(h * 6);
            f = h * 6 - i;
            p = v * (1 - s);
            q = v * (1 - f * s);
            t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return { r: r * 255, g: g * 255, b: b * 255 };
        }

        function render() {
            let data = imgData.data;
            let cw = width / N;
            let ch = height / N;

            // Compute total vorticity for audio
            let totalVorticity = 0;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let idx = IX(i, j);
                    
                    // Calc cell pixel bounds
                    let pxStart = Math.floor((i - 1) * cw);
                    let pyStart = Math.floor((j - 1) * ch);
                    let pxEnd = Math.floor(i * cw);
                    let pyEnd = Math.floor(j * ch);
                    
                    let r = 0, g = 0, b = 0;
                    
                    if (currentMode === MODES.VORTEX && obstacles[idx]) {
                        r = 40; g = 40; b = 40; // Obstacle color
                    } else if (currentMode === MODES.INK) {
                        r = Math.min(255, densityR[idx]);
                        g = Math.min(255, densityG[idx]);
                        b = Math.min(255, densityB[idx]);
                    } else {
                        let d = Math.min(255, density[idx]);
                        r = d; g = d; b = d;
                        
                        // Add some blueish tint to vortex mode
                        if (currentMode === MODES.VORTEX) {
                            r = d * 0.4;
                            g = d * 0.8;
                            b = d;
                        }
                    }

                    // Vorticity estimation for audio
                    let dvx = Vx[IX(i+1, j)] - Vx[IX(i-1, j)];
                    let dvy = Vy[IX(i, j+1)] - Vy[IX(i, j-1)];
                    totalVorticity += Math.abs(dvx) + Math.abs(dvy);

                    for (let py = pyStart; py < pyEnd; py++) {
                        for (let px = pxStart; px < pxEnd; px++) {
                            let pIdx = (py * width + px) * 4;
                            data[pIdx] = r;
                            data[pIdx + 1] = g;
                            data[pIdx + 2] = b;
                            data[pIdx + 3] = 255;
                        }
                    }
                }
            }
            
            ctx.putImageData(imgData, 0, 0);

            // Update HUD
            if (frames % 10 === 0) {
                let v = (totalVorticity / (N*N)) * 100;
                document.getElementById('hud-vorticity').innerText = v.toFixed(2);
                document.getElementById('hud-reynolds').innerText = Math.floor(v * 150 + Math.random() * 50);
            }
            
            updateAudio(totalVorticity);
        }

        // --- Interaction ---
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let hue = 0.5;

        function handleInput(e, type) {
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (x === undefined || y === undefined) return;
            
            initAudio();

            let gridX = Math.floor((x / width) * N) + 1;
            let gridY = Math.floor((y / height) * N) + 1;
            
            if (gridX < 1 || gridX > N || gridY < 1 || gridY > N) return;

            let dx = x - lastX;
            let dy = y - lastY;
            
            if (type === 'start') {
                isDrawing = true;
                lastX = x; lastY = y;
                return;
            } else if (type === 'end') {
                isDrawing = false;
                return;
            }

            if (isDrawing && (Math.abs(dx) > 0 || Math.abs(dy) > 0)) {
                let speed = Math.sqrt(dx*dx + dy*dy);
                let angle = Math.atan2(dy, dx);
                
                // Radius of effect
                let r = 2;
                for (let j = -r; j <= r; j++) {
                    for (let i = -r; i <= r; i++) {
                        let cx = gridX + i;
                        let cy = gridY + j;
                        if (cx >= 1 && cx <= N && cy >= 1 && cy <= N) {
                            add_velocity(cx, cy, dx * 0.2, dy * 0.2);
                            
                            if (currentMode === MODES.INK) {
                                // Color based on direction
                                let dirHue = (angle + Math.PI) / (Math.PI * 2);
                                let col = HSVtoRGB(dirHue, 0.8, 1.0);
                                add_color(cx, cy, col.r, col.g, col.b, 50);
                            } else {
                                add_density(cx, cy, 200);
                            }
                        }
                    }
                }
            }

            lastX = x;
            lastY = y;
        }

        canvas.addEventListener('mousedown', e => handleInput(e, 'start'));
        canvas.addEventListener('mousemove', e => handleInput(e, 'move'));
        canvas.addEventListener('mouseup', e => handleInput(e, 'end'));
        
        canvas.addEventListener('touchstart', e => handleInput(e, 'start'), {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInput(e, 'move'); }, {passive: false});
        canvas.addEventListener('touchend', e => handleInput(e, 'end'));

        // --- Audio Engine ---
        let audioCtx;
        let noiseSource;
        let bandpass;
        let subBass;
        let gainNode;
        let isMuted = true;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // White noise generator
                let bufferSize = 2 * audioCtx.sampleRate;
                let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                
                noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;
                
                // Filters
                bandpass = audioCtx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 400;
                bandpass.Q.value = 1.5;
                
                let lowpass = audioCtx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.value = 800;

                // Sub bass oscillator for vorticity
                subBass = audioCtx.createOscillator();
                subBass.type = 'sine';
                subBass.frequency.value = 40;
                
                let subGain = audioCtx.createGain();
                subGain.gain.value = 0;
                
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0;

                // Routing
                noiseSource.connect(bandpass);
                bandpass.connect(lowpass);
                lowpass.connect(gainNode);
                
                subBass.connect(subGain);
                subGain.connect(gainNode);
                
                gainNode.connect(audioCtx.destination);
                
                noiseSource.start();
                subBass.start();
                
                audioInitialized = true;
                
                // Only unmute if button says unmuted, but default is mute until interact
                if (!isMuted) {
                    document.getElementById('hud-audio').innerText = "ACTIVE [SYNTH]";
                }
            } catch(e) {
                console.error("Audio init failed", e);
            }
        }

        let targetGain = 0;
        let targetFreq = 400;

        function updateAudio(vorticity) {
            if (!audioInitialized || isMuted) {
                if (gainNode) gainNode.gain.value = 0;
                return;
            }
            
            // Map vorticity/activity to audio params
            let activity = Math.min(1.0, vorticity / 150.0);
            
            targetGain = 0.1 + activity * 0.4;
            targetFreq = 200 + activity * 1200;
            
            // Smooth transitions
            gainNode.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.1);
            bandpass.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
        }

        // --- Controls ---
        document.getElementById('btn-ink').onclick = (e) => {
            currentMode = MODES.INK;
            updateModeUI(e.target, "INK DROP");
            setup_obstacles();
        };
        document.getElementById('btn-smoke').onclick = (e) => {
            currentMode = MODES.SMOKE;
            updateModeUI(e.target, "SMOKE");
            setup_obstacles();
        };
        document.getElementById('btn-vortex').onclick = (e) => {
            currentMode = MODES.VORTEX;
            updateModeUI(e.target, "VORTEX STREETS");
            setup_obstacles();
        };
        
        document.getElementById('btn-clear').onclick = () => {
            Vx.fill(0); Vy.fill(0); Vx0.fill(0); Vy0.fill(0);
            density.fill(0); s.fill(0);
            densityR.fill(0); densityG.fill(0); densityB.fill(0);
            sR.fill(0); sG.fill(0); sB.fill(0);
        };

        document.getElementById('btn-mute').onclick = (e) => {
            isMuted = !isMuted;
            e.target.innerText = isMuted ? "Mute: On" : "Mute: Off";
            if (!isMuted) initAudio();
            document.getElementById('hud-audio').innerText = isMuted ? "MUTED" : "ACTIVE [SYNTH]";
            if (audioCtx && !isMuted && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };

        function updateModeUI(activeBtn, name) {
            document.getElementById('btn-ink').classList.remove('active');
            document.getElementById('btn-smoke').classList.remove('active');
            document.getElementById('btn-vortex').classList.remove('active');
            activeBtn.classList.add('active');
            document.getElementById('hud-mode').innerText = name;
        }

        // --- Main Loop ---
        let frames = 0;
        function loop() {
            Vx0.fill(0);
            Vy0.fill(0);
            s.fill(0);
            sR.fill(0);
            sG.fill(0);
            sB.fill(0);
            
            vel_step(Vx, Vy, Vx0, Vy0, dt);
            
            if (currentMode === MODES.INK) {
                color_step(dt);
            } else {
                dens_step(density, s, Vx, Vy, diff, dt);
            }
            
            render();
            frames++;
            requestAnimationFrame(loop);
        }

        // Add some initial disturbance
        setTimeout(() => {
            add_density(Math.floor(N/2), Math.floor(N/2), 500);
            add_velocity(Math.floor(N/2), Math.floor(N/2), 10, -20);
            add_color(Math.floor(N/2), Math.floor(N/2), 255, 0, 100, 100);
        }, 500);

        loop();
    </script>
</body>
</html>
