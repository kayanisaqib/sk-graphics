<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Premium Catalog</title>
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .form-box { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 40px; 
            border-radius: 15px; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            text-align: center; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px); 
            max-width: 400px; 
            width: 90%; 
        }
        h2 { color: #d4af37; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            color: white; 
            outline: none; 
            box-sizing: border-box; 
        }
        input:focus { border-color: #d4af37; }
        button { 
            background: linear-gradient(45deg, #d4af37, #f3e5ab); 
            color: #000; 
            padding: 15px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 15px; 
            font-size: 16px; 
            transition: 0.3s; 
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Premium CNC Catalog</h2>
    <p>Enter your details to instantly view our 2026 designs.</p>

    <!-- Web3Forms Integration -->
    <form action="https://api.web3forms.com/submit" method="POST">
        
        <!--c3da3738-fc5c-498c-8615-4b11a506071f  -->
        <input type="hidden" name="access_key" value=" c3da3738-fc5c-498c-8615-4b11a506071f">

        <input type="text" name="name" placeholder="Your Name (e.g. Ali Builder)" required>
        <input type="email" name="email" placeholder="Your Email Address" required>

        <!-- The Magic Redirect: After form submission, the client is sent directly to your main portfolio -->
        <input type="hidden" name="redirect" value="https://skgraphics.site">

        <button type="submit">Unlock Catalog Now</button>
    </form>
</div>

</body>
</html>
