<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>SK Graphics | Interactive WebGL & 3D Canvas Studio</title>
    <meta name="title" content="SK Graphics | Interactive WebGL & 3D Canvas Studio">
    <meta name="description" content="SK Graphics portfolio: High-performance interactive 3D web environments, custom GLSL shader engines, and downloadable HTML5 canvas digital assets.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="SK Graphics">
    
    <!-- Canonical URL (Google ko batata hai k yehi original page hai) -->
    <link rel="canonical" href="https://skgraphics.site/">
    
    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://skgraphics.site/">
    <meta property="og:title" content="SK Graphics | Interactive WebGL & 3D Canvas Studio">
    <meta property="og:description" content="High-performance interactive 3D web environments and custom GLSL shader assets by SK Graphics.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; color: #ffffff;
            scroll-behavior: smooth;
        }

        nav {
            position: fixed; top: 0; width: 100%;
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }

        .hero {
            position: relative; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        #glcanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.5; }
        .hero-content { z-index: 2; pointer-events: none; max-width: 850px; padding: 0 20px; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.8rem, 6vw, 5.2rem); letter-spacing: 4px; margin-bottom: 15px; }
        h2 { font-size: clamp(0.95rem, 1.8vw, 1.3rem); color: #ffffff; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px; }
        .hero-subtext { font-size: clamp(0.85rem, 1.2vw, 1rem); color: #888888; font-weight: 300; letter-spacing: 1px; line-height: 1.6; }

        .scroll-indicator {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            z-index: 10; color: #ffffff; text-decoration: none; font-size: 0.75rem;
            letter-spacing: 3px; font-weight: 600; display: flex; flex-direction: column; align-items: center;
            animation: bounce 2s infinite; opacity: 0.6;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-12px) translateX(-50%); }
            60% { transform: translateY(-6px) translateX(-50%); }
        }

        .gallery-section { padding: 90px 20px; max-width: 1300px; margin: 0 auto; position: relative; z-index: 10; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; }

        .gallery-card {
            background: #0d0d0d; border: 1px solid #1c1c1c; border-radius: 8px;
            overflow: hidden; transition: border-color 0.3s ease, transform 0.3s ease;
            display: flex; flex-direction: column;
        }
        .gallery-card:hover { transform: translateY(-4px); border-color: #333333; }

        .preview-container {
            width: 100%; height: 320px; position: relative; background: #000000;
            border-bottom: 1px solid #1c1c1c; overflow: hidden;
        }

        .gallery-card img {
            width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer;
        }

        .gallery-card iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        /* Launcher Terminal UI */
        .engine-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            background: radial-gradient(circle at 50% 50%, #151518 0%, #08080a 100%);
            padding: 20px; text-align: center; cursor: pointer;
        }
        .engine-placeholder::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px; pointer-events: none;
        }
        .hud-status {
            font-size: 0.68rem; letter-spacing: 2px; color: #00e676; text-transform: uppercase;
            font-weight: 700; margin-bottom: 15px; z-index: 2;
        }
        .launch-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff; padding: 12px 22px; border-radius: 4px; font-size: 0.72rem;
            font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s ease; z-index: 2;
        }
        .engine-placeholder:hover .launch-btn {
            background: #ffffff; color: #000000; border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .engine-close-btn {
            position: absolute; top: 12px; right: 12px; z-index: 15;
            background: rgba(0,0,0,0.75); border: 1px solid #444; color: #fff;
            padding: 5px 10px; border-radius: 4px; font-size: 0.65rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px);
        }
        .engine-close-btn:hover { background: #ff3344; border-color: #ff3344; }

        .card-content { padding: 24px; text-align: left; flex-grow: 1; display: flex; flex-direction: column; }
        .card-meta { display: flex; justify-content: space-between; font-size: 0.72rem; letter-spacing: 1px; color: #777; margin-bottom: 14px; text-transform: uppercase; font-weight: 600; }
        .card-meta span { background: #181818; padding: 4px 8px; border-radius: 4px; }
        .live-tag { background: #00e676 !important; color: #000 !important; font-weight: 700; }

        .card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: 1px; margin: 0 0 12px 0; color: #ffffff; }
        .card-desc { font-size: 0.82rem; color: #8c8c8c; margin: 0 0 22px 0; line-height: 1.6; font-weight: 300; flex-grow: 1; }
        
        .card-actions { display: flex; gap: 10px; margin-top: auto; }
        .action-btn {
            flex: 1; padding: 11px; background: #ffffff; color: #000000;
            text-decoration: none; font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px;
            border-radius: 4px; transition: 0.25s; text-align: center; text-transform: uppercase;
        }
        .action-btn:hover { background: #cccccc; }
        .action-btn.secondary { background: transparent; color: #ffffff; border: 1px solid #333; }
        .action-btn.secondary:hover { background: #1c1c1c; border-color: #666; }

        .lightbox {
            display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .lightbox img { max-width: 95%; max-height: 95%; border-radius: 4px; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: 300; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">SK GRAPHICS</div>
    </nav>

    <section class="hero" id="home">
        <canvas id="glcanvas"></canvas>
        <div class="hero-content">
            <h1>SK Graphics</h1>
            <h2>Premium Interactive 3D & WebGL Assets</h2>
            <p class="hero-subtext">High-performance digital architecture. Downloadable spatial web environments and custom GLSL shader engines.</p>
        </div>
        <a href="#portfolio" class="scroll-indicator">EXPLORE ENGINES<br><br>&#8595;</a>
    </section>

    <section class="gallery-section" id="portfolio">
        <div class="gallery-grid" id="portfolio-gallery"></div>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Fullscreen View">
    </div>

    <script>
        let currentlyActiveEngine = null;

        function launchEngine(containerId, assetPath, title) {
            if (currentlyActiveEngine && currentlyActiveEngine.id !== containerId) {
                currentlyActiveEngine.reset();
            }

            const container = document.getElementById(containerId);
            container.innerHTML = `
                <button class="engine-close-btn" onclick="event.stopPropagation(); closeEngine('${containerId}', '${assetPath}', '${title}')">✕ Unload Engine</button>
                <iframe src="${assetPath}" title="${title}"></iframe>
            `;

            currentlyActiveEngine = {
                id: containerId,
                reset: () => closeEngine(containerId, assetPath, title)
            };
        }

        function closeEngine(containerId, assetPath, title) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="engine-placeholder" onclick="launchEngine('${containerId}', '${assetPath}', '${title}')">
                    <span class="hud-status">● GPU SHADER // STANDBY</span>
                    <button class="launch-btn">▶ Launch Live Engine</button>
                </div>
            `;
            if (currentlyActiveEngine && currentlyActiveEngine.id === containerId) {
                currentlyActiveEngine = null;
            }
        }

        async function loadExternalJSON() {
            try {
                const response = await fetch('gallery.json'); 
                const data = await response.json();
                const gallery = document.getElementById('portfolio-gallery');

                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'gallery-card';

                    const assetPath = item.assetUrl || item.imageUrl;
                    const isInteractive = item.type === 'interactive' || assetPath.endsWith('.html');
                    const categoryText = item.category || 'Asset';
                    const clientText = item.client || 'Premium';
                    const descriptionText = item.description || '';
                    const containerId = `preview-box-${index}`;

                    let mediaHTML = '';
                    let actionButtonsHTML = '';

                    if (isInteractive) {
                        mediaHTML = `
                            <div class="engine-placeholder" onclick="launchEngine('${containerId}', '${assetPath}', '${item.title}')">
                                <span class="hud-status">● GPU SHADER // STANDBY</span>
                                <button class="launch-btn">▶ Launch Live Engine</button>
                            </div>
                        `;
                        actionButtonsHTML = `
                            <a href="${assetPath}" target="_blank" class="action-btn">Open Full</a>
                            <a href="${assetPath}" download class="action-btn secondary">&#8595; Source</a>
                        `;
                    } else {
                        mediaHTML = `<img src="${assetPath}" alt="${item.title}" loading="lazy" onclick="openLightbox('${assetPath}')">`;
                        actionButtonsHTML = `
                            <a href="${assetPath}" download class="action-btn">&#8595; Download Asset</a>
                        `;
                    }

                    card.innerHTML = `
                        <div class="preview-container" id="${containerId}">
                            ${mediaHTML}
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span>${categoryText}</span>
                                <span class="${isInteractive ? 'live-tag' : ''}">${isInteractive ? '● GLSL ENGINE' : clientText}</span>
                            </div>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${descriptionText}</p>
                            <div class="card-actions">
                                ${actionButtonsHTML}
                            </div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading JSON file:", error);
            }
        }
        
        loadExternalJSON();

        function openLightbox(imageSrc) {
            document.getElementById('lightbox-img').src = imageSrc;
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        // Lightweight Hero Canvas
        const canvas = document.getElementById('glcanvas');
        const ctx = canvas.getContext('2d');
        let width, height; 
        let particles = [];
        let isHeroVisible = true;

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) { particles.push(new Particle()); }

        const heroObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                isHeroVisible = entry.isIntersecting;
                if (isHeroVisible) requestAnimationFrame(animate);
            });
        }, { threshold: 0.1 });

        heroObserver.observe(document.getElementById('home'));

        function animate() {
            if (!isHeroVisible) return;
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; 
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.beginPath(); 
                        ctx.strokeStyle = `rgba(255, 255, 255, ${(120 - distance) / 1100})`;
                        ctx.lineWidth = 0.7; 
                        ctx.moveTo(particles[i].x, particles[i].y); 
                        ctx.lineTo(particles[j].x, particles[j].y); 
                        ctx.stroke();
                    }
                }
            }
            particles.forEach(p => { p.update(); p.draw(); }); 
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
