<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080808; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let step = 0;
        const mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        window.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
        }, { passive: true });
        window.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
        window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

        function drawWave(index, total, time) {
            ctx.beginPath();
            ctx.lineWidth = 1.2;
            const alpha = 0.15 + (index / total) * 0.45;
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;

            const baseHeight = height * 0.5;
            const waveOffset = (index - total / 2) * 18;

            for (let x = 0; x <= width; x += 6) {
                const distMouse = Math.abs(x - mouse.x);
                let mouseInfluence = 0;
                if (distMouse < 180) {
                    mouseInfluence = (1 - distMouse / 180) * 45 * Math.sin((mouse.y - baseHeight) * 0.02);
                }

                const frequency = 0.006;
                const y = baseHeight + waveOffset +
                    Math.sin(x * frequency + time + index * 0.2) * 35 +
                    Math.cos(x * frequency * 0.5 - time * 0.8) * 20 +
                    mouseInfluence;

                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            step += 0.02;
            const lines = 16;
            for (let i = 0; i < lines; i++) {
                drawWave(i, lines, step);
            }
            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>
</body>
</html>
