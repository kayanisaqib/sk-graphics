<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050507; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <canvas id="coreCanvas"></canvas>

    <script>
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const particleCount = 140;
        const mouse = { x: null, y: null, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });
        window.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
            mouse.active = true;
        }, { passive: true });
        window.addEventListener('mouseleave', () => { mouse.active = false; });
        window.addEventListener('touchend', () => { mouse.active = false; });

        class Particle {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.angle = Math.random() * Math.PI * 2;
                const maxRadius = Math.min(width, height) * 0.45;
                this.radius = initial ? Math.random() * maxRadius : maxRadius;
                this.speed = 0.008 + Math.random() * 0.015;
                this.size = Math.random() * 2 + 0.8;
                this.alpha = Math.random() * 0.7 + 0.3;
                this.z = Math.random();
            }
            update() {
                this.angle += this.speed * (0.8 + this.z);
                this.radius -= 0.4;
                if (this.radius < 8) {
                    this.reset();
                }
            }
            draw() {
                const maxRadius = Math.min(width, height) * 0.45;
                const centerX = mouse.active ? mouse.x : width / 2;
                const centerY = mouse.active ? mouse.y : height / 2;
                
                const x = centerX + Math.cos(this.angle) * this.radius;
                const y = centerY + Math.sin(this.angle) * (this.radius * 0.55);

                const fade = Math.min(1, this.radius / (maxRadius * 0.3));
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * fade})`;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 7, 0.25)';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
