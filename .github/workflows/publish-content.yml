name: Auto-Publish Content & Search Engine Ping

# Runs every Wednesday and Saturday at 8:30 AM UTC (1:30 PM PKT)
on:
  schedule:
    - cron: '30 8 * * 3,6'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run publish script
        run: node scripts/publish_next.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "SK Graphics Bot"
          git config user.email "bot@skgraphics.site"
          git add -A
          git commit -m "📦 Auto-publish: New engine deployed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Autonomous Search Engine Indexing Ping
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "Pinging Google and Bing with updated sitemap..."
          curl -s "https://www.google.com/ping?sitemap=https://skgraphics.site/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://skgraphics.site/sitemap.xml" || true
          echo "Search engines successfully pinged!"
